name: Pequeno Restaurante

# Testa o cardápio do Pequeno Restaurante em todo pull request e, na branch main,
# publica o site inteiro no GitHub Pages (cardápio Bardock na raiz + /pequeno-restaurante/).
# Para publicar, o GitHub Pages precisa estar em Settings → Pages → Source: "GitHub Actions".

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: pequeno-restaurante

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pequeno-restaurante/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Testes de permissão do banco (PostgreSQL)
        run: npm run test:sql
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: pequeno-restaurante/test-results
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}pequeno-restaurante/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pequeno-restaurante/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Monta o site
        working-directory: .
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r qrcode _site/
          cp -r pequeno-restaurante/dist _site/pequeno-restaurante
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
